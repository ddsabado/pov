<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>ddwump</title>
    <script>
      // Restore path from ?p= query param set by 404.html redirect
      (function() {
        var p = window.location.search.slice(1).split('&').reduce(function(acc, s) {
          var r = s.split('=');
          acc[decodeURIComponent(r[0])] = decodeURIComponent(r.slice(1).join('='));
          return acc;
        }, {});
        if (p.p !== undefined) {
          window.history.replaceState(null, null,
            '/pov/' + p.p.replace(/&/, '?') + (window.location.hash || '')
          );
        }
      })();
    </script>
  </head>
  <body style="background-color: #000; margin: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
